name: Series Canon & Integrity CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  audit-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Continuity & Compilation Audit
        shell: pwsh
        run: |
          ./scripts/recompile_volumes.ps1 -AuditOnly
